server {
    listen $PORT default_server;
    listen [::]:$PORT default_server;

    root /app/public;
    index index.php;

    # Ikuti symlink — INI KUNCI UTAMANYA
    disable_symlinks off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static files (termasuk storage symlink)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|mp4|webm|pdf|svg|woff|woff2)$ {
        expires max;
        log_not_found off;
        try_files $uri $uri/ =404;
        # Penting: ikuti symlink
        disable_symlinks off;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}