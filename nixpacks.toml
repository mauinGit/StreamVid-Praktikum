[phases.setup]
nixPkgs = [
    'php83',
    'php83Extensions.pdo_mysql',
    'php83Extensions.mbstring',
    'php83Extensions.xml',
    'php83Extensions.curl',
    'php83Extensions.openssl',
    'php83Extensions.tokenizer',
    'php83Extensions.fileinfo',
    'php83Extensions.gd',
    'nodejs_20',
    'npm-9_x'
]

[phases.install]
cmd = './railway-build.sh'

[phases.build]
# Empty or minimal, we already did everything in install phase
cmd = 'echo "Build phase complete"'

# CRITICAL: NO custom start command!!!
# Railway akan otomatis menggunakan PHP-FPM + Nginx
# Hanya perlu migrate yang dijalankan di start
# Kita gunakan prestart script