[phases.setup]
nixPkgs = ['php83', 'php83Extensions.pdo_mysql', 'php83Extensions.mbstring', 'php83Extensions.xml', 'php83Extensions.curl', 'php83Extensions.openssl', 'php83Extensions.tokenizer', 'php83Extensions.fileinfo', 'php83Extensions.gd', 'nodejs_20', 'npm-9_x']

[phases.install]
cmds = [
    'composer install --no-dev --optimize-autoloader',
    'npm ci',
    'npm run build'
]

[phases.build]
cmds = [
    'php artisan view:cache',
    'php artisan storage:link || true'
]

[start]
cmd = 'php artisan config:clear && php artisan storage:link --force && php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}'
